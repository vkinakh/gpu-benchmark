[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-benchmark"
version = "0.1.0"
description = "GPU deep learning benchmarking scripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "accelerate==0.26.1",
  "black==23.12.1",
  "datasets==2.16.1",
  "gputil==1.4.0",
  "huggingface-hub==0.20.3",
  "multiprocess==0.70.15",
  "numpy==1.26.3",
  "pandas==2.2.0",
  "pillow==10.2.0",
  "psutil==5.9.8",
  "pyyaml==6.0.1",
  "requests==2.31.0",
  "safetensors==0.4.2",
  "six==1.16.0",
  "sympy==1.12",
  "timm==0.9.12",
  "tokenizers==0.15.1",
  "torch==2.1.2",
  "torchmetrics==1.3.0.post0",
  "torchvision==0.16.2",
  "tqdm==4.66.1",
  "transformers==4.37.1",
]

[tool.setuptools]
py-modules = [
  "benchmark",
  "llm_inference",
  "monitoring",
  "plot_benchmark",
  "run",
  "train_language_models",
  "train_vision_models",
  "utils",
]
