[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-benchmark"
version = "1.0.1"
description = "GPU deep learning benchmarking scripts"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
 "accelerate==1.15.0", "torch==2.10.0", "torchvision==0.25.0",
 "datasets==5.0.1", "transformers==4.57.6", "timm==1.0.30",
 "torchmetrics==1.9.0", "numpy", "pandas", "matplotlib", "psutil", "pyyaml",
 "nvidia-ml-py==13.615.71", "gputil==1.4.0",
]

[project.optional-dependencies]
fp8 = ["torchao==0.16.0"]

[project.scripts]
gpu-benchmark = "gpu_benchmark.benchmark:main"
gpu-benchmark-run = "gpu_benchmark.run:main"
gpu-benchmark-plot = "gpu_benchmark.plot_benchmark:main"

[dependency-groups]
dev = ["pytest>=8", "black==26.3.1"]

[tool.setuptools.packages.find]
include = ["gpu_benchmark*"]

[tool.setuptools.package-data]
gpu_benchmark = ["*.yaml"]
